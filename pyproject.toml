[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lumoauth"
version = "1.0.0"
description = "Python SDK for LumoAuth Agent authentication and capability management"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
keywords = ["lumoauth", "agent", "authentication", "oauth2", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
aauth = [
    "cryptography>=41.0",
]
api = [
    "lumoauth-api-client>=0.1.0",
]
fastapi = [
    "fastapi>=0.110.0",
    "itsdangerous>=2.1.2",
]
dev = [
    "pytest>=7.0",
    # AAuth tests exercise Ed25519 signing; without this they are skipped.
    "cryptography>=41.0",
]

[project.urls]
Documentation = "https://docs.lumoauth.dev/agents/registry"
Repository = "https://github.com/lumoauth/python"

[tool.hatch.build.targets.wheel]
packages = ["src/lumoauth"]

# Local development: resolve the generated client from the sibling
# api-clients/python checkout instead of a package index (it is not published).
# Only consulted by `uv`; plain pip users get the [api] extra from PyPI.
[tool.uv.sources]
lumoauth-api-client = { path = "../api-clients/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
